<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinball Arcade Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <div id="ui">
                <div id="score-container">
                    <span id="score-label">Placar</span>
                    <div id="score"><span id="score-value">0</span></div>
                </div>
                <a href="/" class="back-button">Sair</a>
            </div>
            <div id="controls-info">
                Use <span class="key">←</span> <span class="key">→</span> ou <span class="key">A</span> <span class="key">D</span> para os flippers | <span class="key">Espaço</span> para Lançar
            </div>
            <canvas id="pinball-canvas"></canvas>
        </div>
    </div>
    
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
