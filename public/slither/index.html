<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: sans-serif;
        }
        #gameCanvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            min-width: 150px;
        }
        #ui h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            text-align: center;
        }
        #leaderboard {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.9rem;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .leaderboard-item span.color-box {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        #back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>
    <a href="/" id="back-btn">Sair do Jogo</a>
    <div id="ui">
        <h2>Sua Pontuação: <span id="score">0</span></h2>
        <div id="leaderboard">
            <!-- Os jogadores serão inseridos aqui via JS -->
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
